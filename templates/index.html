<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Platformer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="960" height="600"></canvas>
    <div id="overlay-root"></div>
  </div>

  <script>
    window.PAC_PLATFORMER_TOTAL_LEVELS = {{ total_levels }};
  </script>

  <!-- Load order matters: each module below depends on the ones above it. -->
  <script src="{{ url_for('static', filename='js/physics.js') }}"></script>
  <script src="{{ url_for('static', filename='js/collision.js') }}"></script>
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/levels.js') }}"></script>
  <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
  <script src="{{ url_for('static', filename='js/interface.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
